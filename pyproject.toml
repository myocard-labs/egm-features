# ---------------------------------------------------------------------------
# pyproject.toml — myocard-egm-features
#
# Per-trace morphology + spectral + complexity feature extractors for
# intracardiac bipolar EGM signals. NumPy/SciPy-only library — no torch,
# no HDF5 I/O (egm-data owns that). The feature math lives in three
# modules (time_domain, frequency, complexity) with a thin bundle helper
# that runs all 11 features over a batch of traces and returns a tidy
# pandas DataFrame.
#
# Convention recap (LOCKED-IN 2026-06-13, see intracardiac-platform/project/refactor_checklist.md):
#   GitHub repo  : egm-features                  (bare)
#   PyPI dist    : myocard-egm-features          (myocard- prefix)
#   Import name  : myocard_egm_features          (underscore)
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "myocard-egm-features"
version = "0.1.1"
description = "Per-trace morphology + spectral + complexity feature extractors for intracardiac bipolar EGM signals."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Daniel Klein", email = "daniel.anthony.klein.88@gmail.com" },
]
keywords = [
  "cardiac",
  "electrophysiology",
  "signal-processing",
  "egm",
  "feature-extraction",
  "entropy",
  "fractal-dimension",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  # numpy is capped below 2.5 as a deliberate, temporary exception to the
  # "floors only, never cap runtime deps" convention: numpy 2.5's type stubs
  # use PEP-695 `type` statements, which mypy refuses to parse under this
  # project's `python_version = "3.10"`, so an unconstrained resolve breaks
  # the type-check job on code that never changed. The cap is about stub
  # parseability, not runtime behaviour, and EXPIRES once the Python floor
  # moves past 3.11. Matches the rest of the fleet.
  "numpy>=1.26,<2.5",
  "scipy>=1.11",
  "pandas>=2.0",
  "antropy>=0.1.6",
]

[project.optional-dependencies]
# Dev tooling is pinned EXACTLY (not floored) so contributors, pre-commit, and
# CI all run the same versions — a floor let CI resolve a newer ruff than
# pre-commit and turned the lint job red on untouched files. Keep ruff in step
# with .pre-commit-config.yaml and .github/workflows/ci.yml.
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff==0.15.17",
  "mypy==2.1.0",
  "pre-commit>=3.7",
  "nbstripout>=0.7",
]

[project.urls]
Homepage      = "https://github.com/myocard-labs/egm-features"
Repository    = "https://github.com/myocard-labs/egm-features"
Issues        = "https://github.com/myocard-labs/egm-features/issues"
Organization  = "https://github.com/myocard-labs"

# No CLI — egm-features is a library only. Per-trace feature extraction is
# called from notebooks, egm-classifier diagnostics, egm-studio's features
# view, and the synthetic v2 sim-realism comparison work.

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["src/myocard_egm_features"]
# Ship py.typed (PEP 561) so downstream consumers' mypy uses our inline types
# instead of treating the package as untyped. Matches egm-data / egm-contracts.
artifacts = [
  "src/myocard_egm_features/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "README.md",
  "LICENSE",
  "NOTICE",
  "pyproject.toml",
]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
ignore = [
  "E501",   # line length handled by formatter
  "RUF002", # allow Greek letters (σ, π, μ, etc.) in docstrings — they're the
            # clearest notation for the math this library implements
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"__init__.py"   = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
filterwarnings = [
  "error",
  # Per-package allowlist below. Add as needed once test failures surface.
]

[tool.coverage.run]
source = ["src/myocard_egm_features"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src", "tests"]

# scipy + antropy + pandas ship without complete py.typed support;
# ignore_missing_imports keeps mypy quiet on those upstream imports.
# (pandas has a pandas-stubs package; we don't pin it as a dev dep yet —
# adding it when bundle.py's DataFrame ergonomics get richer would be a
# natural moment.)
[[tool.mypy.overrides]]
module = [
  "scipy.*",
  "antropy.*",
  "pandas.*",
]
ignore_missing_imports = true
